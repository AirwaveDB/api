name: Validate API

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'src/**'
      - 'v1/**'
      - 'wrangler.toml'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Check scripts and Worker
        run: |
          node --check scripts/build.mjs
          node --check scripts/validate.mjs
          node --check src/worker.js
      - name: Build against current canonical sources
        run: node scripts/build.mjs
      - name: Validate generated API
        run: node scripts/validate.mjs
