name: Build API

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'src/**'
      - 'wrangler.toml'
      - '.github/workflows/build.yml'

permissions:
  contents: write

concurrency:
  group: airwavedb-api-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate Worker source
        run: node --check src/worker.js
      - name: Build public JSON API from canonical datasets
        run: node scripts/build.mjs
      - name: Annotate canonical source snapshots
        run: node scripts/annotate-source.mjs
      - name: Validate static API files
        run: node scripts/validate.mjs
      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- v1)" ]; then
            echo "No API changes"
            exit 0
          fi

          git config user.name "airwavedb-bot"
          git config user.email "airwavedb-bot@users.noreply.github.com"
          git add v1
          git commit -m "chore(data): rebuild API"

          # A maintainer or another workflow may have advanced main while this
          # run was generating data. Rebase, then rebuild from the latest code
          # before publishing so generated files never overwrite newer work.
          git fetch origin main
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
            git rebase origin/main
            node --check src/worker.js
            node scripts/build.mjs
            node scripts/annotate-source.mjs
            node scripts/validate.mjs
            git add v1
            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
          fi

          git push origin HEAD:main
